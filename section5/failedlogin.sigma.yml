title: failed logon attempt
id: a6e5b635-4d7a-4a18-9ce3-66540064b340-midterm-ia462
status: experimental
description: 
	Detects failed login attempts that could indicate brute-force
    activity or password guessing. Maps to MITRE ATT&CK
    T1110.001 (Brute Force: Password Guessing).
author: Adam Strizch (astrizic)
date: 2026/11/21
references:
  - https://attack.mitre.org/techniques/T1110/001/
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4625
  condition: selection
falsepositives:
  - Legitimate users repeatedly entering incorrect passwords.
level: medium
tags:
  - attack.t1110.001
  - attack.bruteforce
  -attack.password
  